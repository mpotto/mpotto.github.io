- title: "RFFNet: Large-scale interpretable kernel methods via random Fourier features"
  authors: [Mateus Piovezan Otto, Rafael Izbicki]
  venue: Computational Statistics
  detail: "41(7), 144"
  year: 2026
  type: journal
  links:
