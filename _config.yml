# Site -----------------------------------------------------------------------
title: Mateus Piovezan Otto
tagline: PhD student in Statistics at the University of Washington
description: >-
  Mateus Piovezan Otto is a PhD student in the Department of Statistics at the
  University of Washington, working on nonparametric and semiparametric
  statistical methods for public health data.
url: "https://mpotto.github.io"
baseurl: ""
lang: en
timezone: America/Los_Angeles

# Who the site is about. The layouts read these fields. ----------------------
author:
  name: Mateus Piovezan Otto
  role: PhD student, Department of Statistics
  affiliation: University of Washington
  email: mpotto@uw.edu
  photo: /images/profile.jpg
  # Links shown under the email on the home page, in this order.
  links:
    - label: Google Scholar
      url: https://scholar.google.com/citations?user=cy8jBFEAAAAJ
    - label: arXiv
      url: https://arxiv.org/a/piovezanotto_m_1.html
    - label: GitHub
      url: https://github.com/mpotto

# Profile links for the JSON-LD block that jekyll-seo-tag emits. --------------
social:
  name: Mateus Piovezan Otto
  links:
    - https://scholar.google.com/citations?user=cy8jBFEAAAAJ
    - https://arxiv.org/a/piovezanotto_m_1.html
    - https://github.com/mpotto
    - https://orcid.org/0000-0003-1855-9606

# Build ----------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
defaults:
  - scope:
      path: ""
    values:
      layout: page
